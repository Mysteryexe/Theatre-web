<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingsTheatre</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <wrapper>
        <page class="flex center">
            <book class="flex" style="gap:0.1rem">
                <closeText onclick="backToMenu(this)">
                    <p class="big">Back to menu</p>
                </closeText>
                <hand style="right:85%"><img src="./content/images/handLeft.png" alt="hand"></hand>
                <hand style="left: 80%; top:55%"><img src="./content/images/handRight.png" alt="hand"></hand>
                <images style="  transform:
    translateY(-53%)
    skewY(5deg)
    translateY(50%);">
                    <group>
                        <p class="title big">Refernces:</p>
                        <p class="small smallpadding">all the images and sources that i've got inspired by to make this
                        </p>
                    </group>
                    <group><img style="rotate:1deg" src="./content/refrences/s-l400.jpg" alt="sl400"><a class="small"
                            href="https://i.ebayimg.com/images/g/iPwAAOSw3gJZKyiT/s-l400.jpg">link</a>
                    </group>
                    <group><img style="rotate:-2deg" src="./content/refrences/KingsAuditorium1945.jpg"
                            alt="KingsAuditorium1945"><a class="small"
                            href="http://www.arthurlloyd.co.uk/Glasgow/Kings.htm">link</a>
                    </group>
                </images>
                <images class="center">
                    <group><img style="rotate:-1deg" src="./content/refrences/m43582142875_7.avif"
                            alt="m43582142875_7"><a class="small"
                            href="https://achievers.edu.ng/products/two-epic-rare-1970-71-los-angeles-entertainment-guides/2193676/">link</a>
                    </group>
                    <group><img style="rotate:-2deg"
                            src="./content/refrences/old-1960s-british-railway-train-ticket-2HCTMEW.jpg"
                            alt="m43582142875_7">
                    </group>
                    <img style="height: 10%; width:auto;margin-top:1rem"
                        src="https://mysteryexe.xyz/apple-touch-icon.png" alt="">
                    <group>
                        <p style="text-align: center;" class="small smallpadding">Designed by <a
                                style="margin:0;padding:2px" href="https://mysteryexe.xyz">Mysteryexe.xyz</a>
                        </p>
                    </group>
                </images>
            </book>
        </page>
    </wrapper>
    <script src="./script.js"></script>
</body>

</html>
